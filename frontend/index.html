<!DOCTYPE html>
<html>
<head>
    <title>SubTrack Lite</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        min-height: 100vh;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
        margin-top: 0;
        color: #4f46e5;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    textarea {
        width: 100%;
        height: 150px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    select {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ccc;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #4338ca;
        transform: translateY(-2px);
    }

    #result {
        margin-top: 20px;
        padding: 20px;
        background: #f8fafc;
        border-radius: 15px;
    }

    .subscription-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
    }

    .footer {
        margin-top: 25px;
        text-align: center;
        color: #777;
        font-size: 14px;
    }
    </style>
        
    
</head>

<body>

<div class="container">

<h1>💳 SubTrack Lite</h1>

<p class="subtitle">
AI-powered Smart Subscription Tracker
</p>

<textarea id="subscriptions">Netflix 199
Spotify 119
Prime 299</textarea>

<br><br>

<select id="language">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="te">Telugu</option>
</select>

<br><br>

<button onclick="analyze()">Analyze</button>

<div id="result"></div>

<script>
async function analyze() {

    const text = document.getElementById("subscriptions").value;
    const language = document.getElementById("language").value;

    const response = await fetch("https://subscription-tracker-2-wwtb.onrender.com/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text,
            language
        })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
        <h3>${data.message}</h3>
        <p><b>Total:</b> ₹${data.monthly_total}</p>
        <p><b>Suggestion:</b> ${data.suggestion}</p>
    `;
}
</script>
<div class="footer">
Built with FastAPI • Render • Ollama • BYOK
</div>

</div>

</body>
</html>
