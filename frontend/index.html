<!DOCTYPE html>
<html>
<head>
    <title>SubTrack Lite</title>
    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 15px;
        }
    </style>
</head>

<body>

<h1>SubTrack Lite</h1>

<p>Enter subscriptions:</p>

<textarea id="subscriptions">Netflix 199
Spotify 119
Prime 299</textarea>

<br><br>

<select id="language">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="te">Telugu</option>
</select>

<br><br>

<button onclick="analyze()">Analyze</button>

<div id="result"></div>

<script>
async function analyze() {

    const text = document.getElementById("subscriptions").value;
    const language = document.getElementById("language").value;

    const response = await fetch("http://127.0.0.1:8000/analyze", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            text,
            language
        })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
        <h3>${data.message}</h3>
        <p><b>Total:</b> ₹${data.monthly_total}</p>
        <p><b>Suggestion:</b> ${data.suggestion}</p>
    `;
}
</script>

</body>
</html>
