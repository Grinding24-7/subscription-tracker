<!DOCTYPE html>
<html>
<head>
    <title>SubTrack Lite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            margin: 0;
            padding: 0;
        }

        .header {
            background: linear-gradient(135deg,#4f46e5,#7c3aed);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            border-radius: 10px;
        }

        select,
        button,
        input {
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td, th {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .stat {
            font-size: 24px;
            font-weight: bold;
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>💳 SubTrack Lite</h1>
    <p>AI Powered Subscription Tracker</p>
</div>

<div class="container">

    <div class="card">

        <h3>Subscriptions</h3>

        <textarea id="subscriptions">Netflix 199
Spotify 119
Prime 299</textarea>

        <br>

        <select id="language">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="te">తెలుగు</option>
        </select>

        <button onclick="analyze()">
            Analyze
        </button>

    </div>

    <div class="card">

        <h3>Summary</h3>

        <div id="summary"></div>

    </div>

    <div class="card">

        <h3>AI Assistant</h3>

        <input
            type="text"
            id="prompt"
            placeholder="Ask for savings suggestions..."
            style="width:100%;"
        >

        <br>

        <select id="provider">
            <option value="local">Local AI (Ollama)</option>
            <option value="byok">BYOK</option>
        </select>

        <button onclick="askAI()">
            Ask AI
        </button>

        <div id="aiResult"></div>

    </div>

</div>

<script>

const API_URL =
    "https://subscription-tracker-2-wwtb.onrender.com";

async function analyze() {

    const text =
        document.getElementById("subscriptions").value;

    const language =
        document.getElementById("language").value;

    const response = await fetch(
        API_URL + "/analyze",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                text,
                language
            })
        }
    );

    const data = await response.json();

    let rows = "";

    data.subscriptions.forEach(sub => {
        rows += `
            <tr>
                <td>${sub.name}</td>
                <td>₹${sub.amount}</td>
            </tr>
        `;
    });

    document.getElementById("summary").innerHTML = `
        <p>${data.message}</p>

        <p class="stat">
            ₹${data.monthly_total}
        </p>

        <p>${data.suggestion}</p>

        <table>
            <tr>
                <th>Name</th>
                <th>Amount</th>
            </tr>

            ${rows}

        </table>
    `;
}

async function askAI() {

    const prompt =
        document.getElementById("prompt").value;

    const provider =
        document.getElementById("provider").value;

    const response = await fetch(
        API_URL + "/ai",
        {
            method: "POST",
            headers: {
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                prompt,
                provider
            })
        }
    );

    const data = await response.json();

    document.getElementById("aiResult").innerHTML =
        "<p><b>Response:</b> "
        + JSON.stringify(data)
        + "</p>";
}

</script>

</body>
</html>
