stages:
  - test

test:
  stage: test
  image: python:3.12
  script:
    - pip install -r backend/requirements.txt
    - python -m py_compile backend/app/main.py

dependency_audit:
  stage: test
  image: python:3.12
  script:
    - pip install pip-audit
    - pip-audit -r backend/requirements.txt

coverage:
  stage: test
  script:
    - pytest --cov=backend

typecheck:
  stage: test
  script:
    - pip install mypy
    - mypy backend

secret_scan:
  stage: test
  image: python:3.12
  script:
    - pip install detect-secrets
    - detect-secrets scan .